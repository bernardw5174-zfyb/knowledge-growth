name: Test workspace helpers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run helper behavior tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py tests/*.py
